name: Feature request / enhancement
description: Suggest something that would make fail2zig more useful or easier to use.
title: "[feat] "
labels: ["type:enh"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing your idea. Tell us what would help and why. You don't need a technical design to make a suggestion.

        **Proposing a new service filter?** Use the [Filter contribution](https://github.com/ul0gic/fail2zig/issues/new?template=filter_contribution.yml) template instead.

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Tell us what you're doing and what's missing or getting in the way.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would make that easier?
      description: Describe the improvement you'd like. You don't need to know how to implement it.
    validations:
      required: true

  - type: textarea
    id: examples
    attributes:
      label: Examples or anything else?
      description: Example output, screenshots, related discussions, or how you handle this today.
    validations:
      required: false

  - type: dropdown
    id: willing-to-pr
    attributes:
      label: Would you like to contribute a PR?
      description: Optional. You're welcome to share an idea whether or not you can work on it.
      options:
        - "Yes, I'd like to work on this."
        - "I'm interested, but would appreciate some guidance."
        - "Not right now, just sharing the idea."
    validations:
      required: false
