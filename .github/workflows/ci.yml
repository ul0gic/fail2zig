name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ZIG_VERSION: "0.14.1"
  ZIG_SHA256: "24aeeec8af16c381934a6cd7d95c807a8cb2cf7df9fa40d359aa884195c4716c"

jobs:
  lint:
    name: Source and workflow checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install Zig ${{ env.ZIG_VERSION }}
        run: |
          curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz" -o /tmp/zig.tar.xz
          echo "${ZIG_SHA256}  /tmp/zig.tar.xz" | sha256sum -c -
          sudo mkdir -p /opt/zig
          sudo tar -xf /tmp/zig.tar.xz -C /opt/zig --strip-components=1
          echo "/opt/zig" >> "$GITHUB_PATH"
          /opt/zig/zig version
      - name: Check formatting
        run: zig fmt --check build.zig build.zig.zon engine/ client/ shared/ tests/
      - name: Ensure lint tools are available
        run: |
          missing=()
          for tool in shellcheck yamllint; do
            if ! command -v "$tool" >/dev/null; then missing+=("$tool"); fi
          done
          if ((${#missing[@]})); then
            sudo apt-get update
            sudo apt-get install -y "${missing[@]}"
          fi
      - name: Check whitespace and YAML
        run: |
          git diff --check HEAD^1 HEAD --
          yamllint -c .yamllint .github/workflows/
          yamllint -d '{extends: .yamllint, rules: {line-length: disable}}' .github/ISSUE_TEMPLATE/
      - name: Test release failure handling
        run: bash .github/scripts/release_test.sh
      - name: Lint scripts
        run: |
          shellcheck -S warning tests/harness/*.sh tests/harness/acceptance/*/*.sh tests/e2e/*.sh .github/scripts/*.sh
          if [ -f scripts/install.sh ]; then
            shellcheck -S warning scripts/install.sh
          fi
      - name: Run zizmor (GitHub Actions SAST)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pipx run zizmor==1.25.2 --min-severity medium .github/workflows/
      - name: Verify every .zig file carries the SPDX + copyright header
        run: |
          missing=$(find engine client shared tests build.zig \
            -type f -name '*.zig' \
            -exec grep -L 'SPDX-License-Identifier' {} +)
          if [ -n "$missing" ]; then
            echo "::error::.zig files missing SPDX-License-Identifier header:"
            echo "$missing"
            exit 1
          fi
          echo "SPDX header present on every tracked .zig file."

  test:
    name: Assembled tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Zig ${{ env.ZIG_VERSION }}
        run: |
          curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz" -o /tmp/zig.tar.xz
          echo "${ZIG_SHA256}  /tmp/zig.tar.xz" | sha256sum -c -
          sudo mkdir -p /opt/zig
          sudo tar -xf /tmp/zig.tar.xz -C /opt/zig --strip-components=1
          echo "/opt/zig" >> "$GITHUB_PATH"
          /opt/zig/zig version
      - name: Cache zig-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .zig-cache
          key: zig-cache-test-${{ runner.os }}-${{ env.ZIG_VERSION }}-${{ hashFiles('build.zig', 'build.zig.zon') }}
          restore-keys: |
            zig-cache-test-${{ runner.os }}-${{ env.ZIG_VERSION }}-
      - name: Assembled daemon and firewall checks
        run: /usr/bin/time -v zig build test-ci-assembled test-firewall -Doptimize=ReleaseSafe -j2 --summary all

  ci-result:
    name: CI result
    timeout-minutes: 5
    if: always()
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Require every check to pass
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
      - name: Record exact-commit full qualification
        if: >-
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') &&
          !contains(needs.*.result, 'skipped')
        run: |
          actual=$(git rev-parse HEAD)
          [[ $actual == "${GITHUB_SHA:?}" && $actual =~ ^[0-9a-f]{40}$ ]]
          jq -n --arg repository "${GITHUB_REPOSITORY:?}" --arg source_commit "$actual" \
              --arg event "${GITHUB_EVENT_NAME:?}" --arg run_id "${GITHUB_RUN_ID:?}" \
              --arg run_attempt "${GITHUB_RUN_ATTEMPT:?}" \
              '{schema:1, repository:$repository, workflow:".github/workflows/ci.yml",
                source_commit:$source_commit, route:"full", event:$event,
                run_id:$run_id, run_attempt:$run_attempt}' > qualification.json
      - name: Retain exact-commit full qualification
        if: >-
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') &&
          !contains(needs.*.result, 'skipped')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ci-qualification
          path: qualification.json
          if-no-files-found: error
          retention-days: 90
          overwrite: true
