name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ZIG_VERSION: "0.14.1"
  ZIG_SHA256: "24aeeec8af16c381934a6cd7d95c807a8cb2cf7df9fa40d359aa884195c4716c"

jobs:
  fmt:
    name: zig fmt --check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Zig ${{ env.ZIG_VERSION }}
        run: |
          curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz" -o /tmp/zig.tar.xz
          echo "${ZIG_SHA256}  /tmp/zig.tar.xz" | sha256sum -c -
          sudo mkdir -p /opt/zig
          sudo tar -xf /tmp/zig.tar.xz -C /opt/zig --strip-components=1
          echo "/opt/zig" >> "$GITHUB_PATH"
          /opt/zig/zig version
      - name: Check formatting
        run: zig fmt --check engine/ client/ shared/ tests/

  build-native:
    name: Build (native Debug)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Zig ${{ env.ZIG_VERSION }}
        run: |
          curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz" -o /tmp/zig.tar.xz
          echo "${ZIG_SHA256}  /tmp/zig.tar.xz" | sha256sum -c -
          sudo mkdir -p /opt/zig
          sudo tar -xf /tmp/zig.tar.xz -C /opt/zig --strip-components=1
          echo "/opt/zig" >> "$GITHUB_PATH"
          /opt/zig/zig version
      - name: Cache zig-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .zig-cache
          key: zig-cache-build-${{ runner.os }}-${{ env.ZIG_VERSION }}-${{ hashFiles('build.zig', 'build.zig.zon') }}
          restore-keys: |
            zig-cache-build-${{ runner.os }}-${{ env.ZIG_VERSION }}-
      - name: zig build
        run: zig build

  test:
    name: Tests (std.testing.allocator leak detection)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Zig ${{ env.ZIG_VERSION }}
        run: |
          curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz" -o /tmp/zig.tar.xz
          echo "${ZIG_SHA256}  /tmp/zig.tar.xz" | sha256sum -c -
          sudo mkdir -p /opt/zig
          sudo tar -xf /tmp/zig.tar.xz -C /opt/zig --strip-components=1
          echo "/opt/zig" >> "$GITHUB_PATH"
          /opt/zig/zig version
      - name: Cache zig-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .zig-cache
          key: zig-cache-test-${{ runner.os }}-${{ env.ZIG_VERSION }}-${{ hashFiles('build.zig', 'build.zig.zon') }}
          restore-keys: |
            zig-cache-test-${{ runner.os }}-${{ env.ZIG_VERSION }}-
      - name: Bounded local release checks
        run: zig build test-release-local -Doptimize=ReleaseSafe

  release-target:
    name: Build ${{ matrix.target }} ReleaseSafe
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - {target: x86_64-linux-musl, cpu: baseline, elf: "ELF 64-bit LSB.*x86-64"}
          - {target: aarch64-linux-musl, cpu: baseline, elf: "ELF 64-bit LSB.*ARM aarch64"}
          - {target: arm-linux-musleabihf, cpu: baseline, elf: "ELF 32-bit LSB.*ARM"}
          - {target: mips-linux-musleabi, cpu: mips32r2, elf: "ELF 32-bit MSB.*MIPS"}
          - {target: mipsel-linux-musleabi, cpu: mips32r2, elf: "ELF 32-bit LSB.*MIPS"}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Zig ${{ env.ZIG_VERSION }}
        run: |
          curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz" -o /tmp/zig.tar.xz
          echo "${ZIG_SHA256}  /tmp/zig.tar.xz" | sha256sum -c -
          sudo mkdir -p /opt/zig
          sudo tar -xf /tmp/zig.tar.xz -C /opt/zig --strip-components=1
          echo "/opt/zig" >> "$GITHUB_PATH"
          /opt/zig/zig version
      - name: Cache zig-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .zig-cache
          key: zig-cache-release-${{ matrix.target }}-${{ runner.os }}-${{ env.ZIG_VERSION }}-${{ hashFiles('build.zig', 'build.zig.zon') }}
          restore-keys: |
            zig-cache-release-${{ matrix.target }}-${{ runner.os }}-${{ env.ZIG_VERSION }}-
      - name: Build ReleaseSafe static binaries
        env:
          RELEASE_TARGET: ${{ matrix.target }}
          RELEASE_CPU: ${{ matrix.cpu }}
        run: zig build -Dtarget="$RELEASE_TARGET" -Dcpu="$RELEASE_CPU" -Doptimize=ReleaseSafe -Dstrip=true
      - name: Verify the single executable and static linkage
        env:
          EXPECTED_ELF: ${{ matrix.elf }}
        run: |
          find zig-out/bin -maxdepth 1 -type f -printf '%f\n' \
            | LC_ALL=C sort > actual-executables
          printf '%s\n' fail2zig > expected-executables
          diff -u expected-executables actual-executables
          file zig-out/bin/fail2zig
          if ! file zig-out/bin/fail2zig | grep -q "$EXPECTED_ELF"; then
            echo "::error::fail2zig has the wrong ELF architecture"
            exit 1
          fi
          if ! file zig-out/bin/fail2zig | grep -q ", stripped"; then
            echo "::error::fail2zig contains debug information"
            exit 1
          fi
          if readelf -l zig-out/bin/fail2zig | grep -q 'INTERP' || \
             readelf -d zig-out/bin/fail2zig | grep -q NEEDED; then
            echo "::error::fail2zig has a dynamic interpreter"
            exit 1
          fi

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint scripts
        run: |
          shellcheck -S warning tests/harness/*.sh tests/e2e/*.sh
          if [ -f scripts/install.sh ]; then
            shellcheck -S warning scripts/install.sh
          fi

  yamllint:
    name: yamllint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install yamllint
        run: sudo apt-get update && sudo apt-get install -y yamllint
      - name: Lint CI YAML
        run: yamllint -c .yamllint .github/workflows/

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Run zizmor (GitHub Actions SAST)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pipx run zizmor==1.25.2 --min-severity medium .github/workflows/

  spdx:
    name: SPDX headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify every .zig file carries the SPDX + copyright header
        run: |
          missing=$(find engine client shared tests build.zig \
            -type f -name '*.zig' \
            -exec grep -L 'SPDX-License-Identifier' {} +)
          if [ -n "$missing" ]; then
            echo "::error::.zig files missing SPDX-License-Identifier header:"
            echo "$missing"
            exit 1
          fi
          echo "SPDX header present on every tracked .zig file."
