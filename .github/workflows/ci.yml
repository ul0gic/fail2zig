name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  select:
    name: Select checks
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    outputs:
      full: ${{ steps.select.outputs.full }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: select
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: bash .github/scripts/ci-select.sh

  lint:
    name: Source and workflow checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup-zig
        id: zig
        with:
          cache: "false"
      - name: Check formatting
        env:
          F2Z_ZIG: ${{ steps.zig.outputs.executable }}
        run: '"$F2Z_ZIG" fmt --check build.zig build.zig.zon engine/ client/ shared/ tests/'
      - name: Install lint tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck yamllint
      - name: Check whitespace and YAML
        run: |
          git diff --check HEAD^1 HEAD --
          yamllint -c .yamllint .github/workflows/ .github/actions/
          yamllint -d '{extends: .yamllint, rules: {line-length: disable}}' .github/ISSUE_TEMPLATE/
      - name: Test release failure handling
        run: bash .github/scripts/release_test.sh
      - name: Lint scripts
        run: shellcheck -S warning tests/harness/*.sh tests/harness/acceptance/*/*.sh tests/e2e/*.sh .github/scripts/*.sh scripts/install.sh
      - name: Workflow security analysis
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/workflow-lint.sh
      - name: Verify source license headers
        run: |
          missing=$(find engine client shared tests build.zig -type f -name '*.zig' -exec grep -L 'SPDX-License-Identifier' {} +)
          if [ -n "$missing" ]; then printf '%s\n' "$missing"; exit 1; fi

  test:
    name: Product qualification
    needs: select
    if: needs.select.outputs.full == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      source_tree: ${{ steps.candidate.outputs.source_tree }}
      binary_sha256: ${{ steps.candidate.outputs.binary_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-zig
        id: zig
      - name: Assembled daemon and firewall parser checks
        env:
          F2Z_ZIG: ${{ steps.zig.outputs.executable }}
        run: |
          "$F2Z_ZIG" build test-ci-assembled test-firewall -Dtarget=x86_64-linux-musl -Dcpu=baseline -Doptimize=ReleaseSafe -Dstrip=true -j2 --summary all
          sha256sum zig-out/bin/fail2zig > "$RUNNER_TEMP/tested-binary.sha256"
      - name: Install kernel acceptance prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y nftables iptables ipset
      - name: Build focused kernel acceptance executables
        env:
          F2Z_ZIG: ${{ steps.zig.outputs.executable }}
        run: |
          "$F2Z_ZIG" build build-admin-tests build-native-daemon-tests build-native-firewall-tests \
            -Dtest-filter=kernel: -Dtarget=x86_64-linux-musl -Dcpu=baseline -Doptimize=ReleaseSafe -Dstrip=true -j2 --summary all
      - name: Real kernel acceptance in private namespaces
        run: bash .github/scripts/ci-kernel.sh
      - name: Record tested candidate
        id: candidate
        run: |
          sha256sum --check --strict "$RUNNER_TEMP/tested-binary.sha256"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mkdir ci-candidate
          cp zig-out/bin/fail2zig ci-candidate/fail2zig
          (cd ci-candidate && sha256sum fail2zig > SHA256SUMS)
          digest=$(cut -d ' ' -f 1 ci-candidate/SHA256SUMS)
          printf 'source_tree=%s\nbinary_sha256=%s\n' "$(git rev-parse 'HEAD^{tree}')" "$digest" >> "$GITHUB_OUTPUT"
          printf 'Tested x86_64 SHA-256: %s\n' "$digest" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: tested-x86_64-${{ github.run_attempt }}
          path: ci-candidate/
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: kernel-results-${{ github.run_attempt }}
          path: kernel-results/
          if-no-files-found: ignore
          retention-days: 14

  ci-result:
    name: CI result
    if: always()
    needs: [select, lint, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Require every selected check to pass
        env:
          SELECT: ${{ needs.select.result }}
          LINT: ${{ needs.lint.result }}
          FULL: ${{ needs.select.outputs.full }}
          TEST: ${{ needs.test.result }}
        run: |
          test "$SELECT" = success
          test "$LINT" = success
          case "$FULL:$TEST" in true:success|false:skipped) ;; *) exit 1 ;; esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Record qualification
        env:
          FULL: ${{ needs.select.outputs.full }}
          TESTED_TREE: ${{ needs.test.outputs.source_tree }}
          BINARY_SHA256: ${{ needs.test.outputs.binary_sha256 }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          actual=$(git rev-parse HEAD)
          tree=$(git rev-parse 'HEAD^{tree}')
          test "$actual" = "$GITHUB_SHA"
          route=docs
          if [ "$FULL" = true ]; then
            route=full
            test "$TESTED_TREE" = "$tree"
            [[ $BINARY_SHA256 =~ ^[0-9a-f]{64}$ ]]
          fi
          jq -n --arg repository "$GITHUB_REPOSITORY" --arg source "$actual" --arg tree "$tree" \
            --arg event "$GITHUB_EVENT_NAME" --arg run "$GITHUB_RUN_ID" --arg attempt "$GITHUB_RUN_ATTEMPT" \
            --arg pr "$PR_NUMBER" --arg head "$PR_HEAD" --arg base "$PR_BASE" --arg route "$route" \
            --arg binary "$BINARY_SHA256" \
            '{schema:2, repository:$repository, workflow:".github/workflows/ci.yml", source_commit:$source,
              source_tree:$tree, event:$event, run_id:$run, run_attempt:$attempt, pull_request:$pr,
              head_commit:$head, base_commit:$base, route:$route, binary_sha256:$binary}' > qualification.json
          sha256sum qualification.json > qualification.sha256
          cat qualification.sha256 >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ci-qualification-${{ github.run_attempt }}
          path: |
            qualification.json
            qualification.sha256
          if-no-files-found: error
          retention-days: 90
