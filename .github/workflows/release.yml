name: Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing draft release tag (must be v0.4.0)
        required: true
        type: string
      source_commit:
        description: Approved 40-character source commit for the tag
        required: true
        type: string
      binary_sha256:
        description: Approved SHA-256 of fail2zig-v0.4.0-x86_64-linux-musl
        required: true
        type: string
      manifest_sha256:
        description: Approved SHA-256 of SHA256SUMS
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  publish-retained-candidate:
    name: Verify and publish retained candidate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      SOURCE_COMMIT: ${{ inputs.source_commit }}
      BINARY_SHA256: ${{ inputs.binary_sha256 }}
      MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.source_commit }}

      - name: Verify approved source and tag
        shell: bash
        run: |
          if [[ "${RELEASE_TAG}" != "v0.4.0" ]]; then
            echo "::error::this workflow publishes only the approved v0.4.0 release"
            exit 1
          fi
          if [[ ! "${SOURCE_COMMIT}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::source_commit must be a lowercase 40-character commit ID"
            exit 1
          fi
          if [[ ! "${BINARY_SHA256}" =~ ^[0-9a-f]{64}$ ]] || \
             [[ ! "${MANIFEST_SHA256}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::approved hashes must be lowercase SHA-256 values"
            exit 1
          fi

          checked_out="$(git rev-parse HEAD)"
          tagged="$(git rev-list -n 1 "${RELEASE_TAG}")"
          if [[ "${checked_out}" != "${SOURCE_COMMIT}" ]] || \
             [[ "${tagged}" != "${SOURCE_COMMIT}" ]]; then
            echo "::error::approved commit, checkout, and release tag do not match"
            exit 1
          fi

          expected_version="${RELEASE_TAG#v}"
          source_version="$(sed -n 's/^ *\.version = "\([^"]*\)".*/\1/p' build.zig.zon)"
          if [[ "${source_version}" != "${expected_version}" ]]; then
            echo "::error::build.zig.zon version '${source_version}' does not match ${RELEASE_TAG}"
            exit 1
          fi
          if [[ ! -f RELEASE_NOTES.md ]]; then
            echo "::error::RELEASE_NOTES.md is required at the approved commit"
            exit 1
          fi

      - name: Download the retained draft candidate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          draft="$(gh release view "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" --json isDraft --jq .isDraft)"
          if [[ "${draft}" != "true" ]]; then
            echo "::error::${RELEASE_TAG} must exist as a draft release"
            exit 1
          fi
          mkdir candidate
          gh release download "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" --dir candidate

      - name: Verify exact candidate bytes
        shell: bash
        run: |
          expected_version="0.4.0"
          binary="fail2zig-v0.4.0-x86_64-linux-musl"

          printf '%s\n' \
            "${binary}" \
            fail2zig-v0.4.0-aarch64-linux-musl \
            fail2zig-v0.4.0-arm-linux-musleabihf \
            fail2zig-v0.4.0-mips-linux-musleabi \
            fail2zig-v0.4.0-mipsel-linux-musleabi \
            COPYING.date-profile \
            LICENSE \
            SHA256SUMS \
            SQLITE-NOTICE.md \
            fail2zig.1 \
            fail2zig.service \
            fail2zig.toml.5 \
            fail2zig.toml.example \
            install.sh \
            | LC_ALL=C sort > expected-files
          find candidate -mindepth 1 -maxdepth 1 -type f -printf '%f\n' \
            | LC_ALL=C sort > actual-files
          if find candidate -mindepth 1 -maxdepth 1 ! -type f -print -quit \
            | grep -q .; then
            echo "::error::candidate contains a directory, symlink, or special file"
            exit 1
          fi
          diff -u expected-files actual-files

          printf '%s\n' \
            "${binary}" \
            fail2zig-v0.4.0-aarch64-linux-musl \
            fail2zig-v0.4.0-arm-linux-musleabihf \
            fail2zig-v0.4.0-mips-linux-musleabi \
            fail2zig-v0.4.0-mipsel-linux-musleabi \
            COPYING.date-profile \
            LICENSE \
            SQLITE-NOTICE.md \
            fail2zig.1 \
            fail2zig.service \
            fail2zig.toml.5 \
            fail2zig.toml.example \
            install.sh \
            | LC_ALL=C sort > expected-manifest-files
          sed -E 's/^[0-9a-f]{64} [ *]//' candidate/SHA256SUMS \
            | LC_ALL=C sort > actual-manifest-files
          diff -u expected-manifest-files actual-manifest-files

          echo "${MANIFEST_SHA256}  candidate/SHA256SUMS" \
            | sha256sum --check --strict
          echo "${BINARY_SHA256}  candidate/${binary}" \
            | sha256sum --check --strict
          (cd candidate && sha256sum --check --strict SHA256SUMS)

          for target in x86_64-linux-musl aarch64-linux-musl arm-linux-musleabihf \
            mips-linux-musleabi mipsel-linux-musleabi; do
            artifact="candidate/fail2zig-v0.4.0-${target}"
            case "$target" in
              x86_64-*) expected='ELF 64-bit LSB.*x86-64' ;;
              aarch64-*) expected='ELF 64-bit LSB.*ARM aarch64' ;;
              arm-*) expected='ELF 32-bit LSB.*ARM' ;;
              mips-*) expected='ELF 32-bit MSB.*MIPS' ;;
              mipsel-*) expected='ELF 32-bit LSB.*MIPS' ;;
            esac
            file "$artifact"
            if ! file "$artifact" | grep -q "$expected"; then
              echo "::error::wrong architecture for $target"
              exit 1
            fi
            if ! file "$artifact" | grep -q ", stripped"; then
              echo "::error::debug information in $target"
              exit 1
            fi
            if readelf -l "$artifact" | grep -q INTERP || \
               readelf -d "$artifact" | grep -q NEEDED; then
              echo "::error::dynamic linkage in $target"
              exit 1
            fi
          done
          chmod u+x "candidate/${binary}"
          actual_version="$("candidate/${binary}" --version)"
          if [[ "${actual_version}" != "fail2zig ${expected_version}" ]]; then
            echo "::error::release executable printed '${actual_version}'"
            exit 1
          fi

      - name: Publish the verified draft without replacing assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release edit "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "fail2zig ${RELEASE_TAG}" \
            --notes-file RELEASE_NOTES.md \
            --draft=false \
            --latest

  verify-published-release:
    name: Re-download and verify published bytes
    needs: publish-retained-candidate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      BINARY_SHA256: ${{ inputs.binary_sha256 }}
      MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
    steps:
      - name: Download published assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          mkdir published
          gh release download "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" --dir published

      - name: Verify published allowlist and checksums
        shell: bash
        run: |
          expected_version="0.4.0"
          binary="fail2zig-v0.4.0-x86_64-linux-musl"

          printf '%s\n' \
            "${binary}" \
            fail2zig-v0.4.0-aarch64-linux-musl \
            fail2zig-v0.4.0-arm-linux-musleabihf \
            fail2zig-v0.4.0-mips-linux-musleabi \
            fail2zig-v0.4.0-mipsel-linux-musleabi \
            COPYING.date-profile \
            LICENSE \
            SHA256SUMS \
            SQLITE-NOTICE.md \
            fail2zig.1 \
            fail2zig.service \
            fail2zig.toml.5 \
            fail2zig.toml.example \
            install.sh \
            | LC_ALL=C sort > expected-files
          find published -mindepth 1 -maxdepth 1 -type f -printf '%f\n' \
            | LC_ALL=C sort > actual-files
          if find published -mindepth 1 -maxdepth 1 ! -type f -print -quit \
            | grep -q .; then
            echo "::error::published release contains a directory, symlink, or special file"
            exit 1
          fi
          diff -u expected-files actual-files

          printf '%s\n' \
            "${binary}" \
            fail2zig-v0.4.0-aarch64-linux-musl \
            fail2zig-v0.4.0-arm-linux-musleabihf \
            fail2zig-v0.4.0-mips-linux-musleabi \
            fail2zig-v0.4.0-mipsel-linux-musleabi \
            COPYING.date-profile \
            LICENSE \
            SQLITE-NOTICE.md \
            fail2zig.1 \
            fail2zig.service \
            fail2zig.toml.5 \
            fail2zig.toml.example \
            install.sh \
            | LC_ALL=C sort > expected-manifest-files
          sed -E 's/^[0-9a-f]{64} [ *]//' published/SHA256SUMS \
            | LC_ALL=C sort > actual-manifest-files
          diff -u expected-manifest-files actual-manifest-files

          echo "${MANIFEST_SHA256}  published/SHA256SUMS" \
            | sha256sum --check --strict
          echo "${BINARY_SHA256}  published/${binary}" \
            | sha256sum --check --strict
          (cd published && sha256sum --check --strict SHA256SUMS)

          chmod u+x "published/${binary}"
          actual_version="$("published/${binary}" --version)"
          if [[ "${actual_version}" != "fail2zig ${expected_version}" ]]; then
            echo "::error::published executable printed '${actual_version}'"
            exit 1
          fi
