# fail2zig — release pipeline
#
# Triggered by pushing a `v*` tag (e.g. `v0.1.0`). Produces a GitHub Release
# with stripped static musl binaries for each supported target, plus a
# SHA256SUMS manifest and the systemd unit file so `scripts/install.sh` can
# fetch everything from one URL tree.
#
# Release notes
# -------------
# By default the release body is auto-generated by GitHub from the commits
# and pull requests that landed since the previous tag. No manual file is
# required to cut a release.
#
# If custom prose is wanted for a specific release (e.g. to lead with a
# summary before the commit list), drop a `RELEASE_NOTES.md` at the repo
# root before tagging — the workflow will read it as the body and append
# the auto-generated commit list below. The file is transient: commit it
# along with the tag, delete it after the release is published.
#
# Cross-compile matrix covers x86_64, aarch64, and armv7 (arm-linux-musleabihf).
# mips-linux-musl is still excluded: SYS-009's code bugs (u64 atomics + timeval
# casts) are fixed, but Zig 0.14.1 cannot provide musl libc for the
# `mips-linux-musl` target ("unable to find or provide libc for target
# 'mips-linux...-musl'"). That's a toolchain limitation, not our code.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  ZIG_VERSION: "0.14.1"
  # SHA256 of zig-x86_64-linux-${ZIG_VERSION}.tar.xz — keep in sync with
  # ZIG_VERSION and with ci.yml. Supply-chain audit trail.
  ZIG_SHA256: "24aeeec8af16c381934a6cd7d95c807a8cb2cf7df9fa40d359aa884195c4716c"

jobs:
  build-release:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # mips-linux-musl excluded — Zig 0.14.1 lacks musl libc for it (SYS-009).
        target:
          - x86_64-linux-musl
          - aarch64-linux-musl
          - arm-linux-musleabihf
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Install Zig ${{ env.ZIG_VERSION }}
        run: |
          curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz" -o /tmp/zig.tar.xz
          echo "${ZIG_SHA256}  /tmp/zig.tar.xz" | sha256sum -c -
          sudo mkdir -p /opt/zig
          sudo tar -xf /tmp/zig.tar.xz -C /opt/zig --strip-components=1
          echo "/opt/zig" >> "$GITHUB_PATH"
          /opt/zig/zig version

      - name: Extract version from tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ -z "${version}" ]; then
            echo "::error::could not derive version from tag ${GITHUB_REF_NAME}"
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "Building release artifacts for v${version} (${{ matrix.target }})"

      - name: Build ReleaseSafe static binaries
        run: zig build -Dtarget=${{ matrix.target }} -Doptimize=ReleaseSafe

      - name: Strip binaries
        run: |
          # Zig produces already-stripped ReleaseSafe binaries for most cases,
          # but llvm-strip drops any residual debug sections and shrinks the
          # artifacts a further ~5-10%. Use llvm-strip because it handles the
          # aarch64 ELFs from a cross build without needing target-specific
          # binutils installed on the x86_64 runner.
          sudo apt-get update
          sudo apt-get install -y llvm
          llvm-strip --strip-all zig-out/bin/fail2zig
          llvm-strip --strip-all zig-out/bin/fail2zig-client

      - name: Verify binary is statically linked
        run: |
          file zig-out/bin/fail2zig
          file zig-out/bin/fail2zig-client
          if file zig-out/bin/fail2zig | grep -q "dynamically linked"; then
            echo "::error::fail2zig is dynamically linked; expected static musl binary"
            exit 1
          fi

      - name: Rename artifacts
        run: |
          mkdir -p dist
          v="${{ steps.version.outputs.version }}"
          t="${{ matrix.target }}"
          cp zig-out/bin/fail2zig         "dist/fail2zig-v${v}-${t}"
          cp zig-out/bin/fail2zig-client  "dist/fail2zig-client-v${v}-${t}"

      - name: Upload build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fail2zig-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  create-release:
    name: Create GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: write       # publish the GitHub Release + upload assets
      id-token: write        # OIDC token for build-provenance attestation
      attestations: write    # write the provenance attestation
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Extract version from tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Resolve release body source
        id: body
        run: |
          if [ -f RELEASE_NOTES.md ]; then
            echo "Using repo-root RELEASE_NOTES.md as the release body prose."
            echo "path=RELEASE_NOTES.md" >> "${GITHUB_OUTPUT}"
          else
            echo "No RELEASE_NOTES.md found — release body will be auto-generated from commits."
            echo "path=" >> "${GITHUB_OUTPUT}"
          fi

      - name: Download all build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts/

      - name: Assemble release directory
        run: |
          mkdir -p release
          # Flatten per-target artifact directories into one.
          find artifacts -type f -name 'fail2zig*' -exec cp {} release/ \;
          # Bundle the systemd unit + example config so scripts/install.sh can
          # fetch them from the release page, not from a checkout.
          cp deploy/fail2zig.service release/ 2>/dev/null || true
          cp deploy/fail2zig.socket  release/ 2>/dev/null || true
          cp deploy/fail2zig.toml.example release/ 2>/dev/null || true
          ls -la release/

      - name: Compute SHA256SUMS
        working-directory: release
        run: |
          sha256sum -- * > SHA256SUMS
          echo "--- SHA256SUMS ---"
          cat SHA256SUMS

      - name: Guard release directory is non-empty
        # Mirrors the old action's `fail_on_unmatched_files: true`: refuse to
        # publish an empty release if artifact assembly silently produced
        # nothing. The assemble + SHA256SUMS steps already guarantee files
        # exist, but fail loud rather than cut a contentless release.
        run: |
          if [ -z "$(find release -maxdepth 1 -type f -print -quit)" ]; then
            echo "::error::release/ is empty — nothing to publish"
            exit 1
          fi

      - name: Attest build provenance
        # Generates a signed SLSA provenance attestation for the release
        # executables (not SHA256SUMS or the systemd/.toml files). Verifiable
        # afterwards with `gh attestation verify <binary> --repo <repo>`.
        # Requires id-token: write + attestations: write (granted on this job).
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: release/fail2zig*-linux-musl*

      - name: Create release
        # Native gh CLI replaces the third-party softprops/action-gh-release —
        # one fewer non-actions/* dependency (and its transitive node_modules)
        # in a contents:write context. gh is preinstalled on ubuntu-latest and
        # already used by verify-release. Behaviour preserved: same tag/title,
        # auto-generated notes (+ optional RELEASE_NOTES.md prose prepended),
        # public (non-draft, non-prerelease), all release/* files as assets.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=(
            "${GITHUB_REF_NAME}"
            --title "fail2zig ${GITHUB_REF_NAME}"
            --generate-notes
          )
          body_path="${{ steps.body.outputs.path }}"
          if [ -n "${body_path}" ]; then
            # Prepend the RELEASE_NOTES.md prose; --generate-notes appends the
            # auto-generated commit/PR list below it.
            args+=(--notes-file "${body_path}")
          fi
          # Positional asset args mirror the old `files: release/*`.
          gh release create "${args[@]}" release/*

  verify-release:
    name: Verify published release
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: read         # only downloads the published release assets
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Download released assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p verify
          cd verify
          gh release download "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}"
          ls -la

      - name: Verify SHA256SUMS matches downloaded files
        working-directory: verify
        run: |
          if [ ! -f SHA256SUMS ]; then
            echo "::error::SHA256SUMS missing from published release"
            exit 1
          fi
          sha256sum --check --strict SHA256SUMS
          echo "All release artifacts verified against published SHA256SUMS."
