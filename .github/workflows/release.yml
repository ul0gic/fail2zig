name: Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing draft release tag (vMAJOR.MINOR.PATCH)
        required: true
        type: string
      source_commit:
        description: Approved full lowercase source commit SHA
        required: true
        type: string
      binary_sha256:
        description: Lab-approved SHA-256 of the x86_64 release executable
        required: true
        type: string
      manifest_sha256:
        description: Approved SHA-256 of the draft SHA256SUMS (all 13 payloads)
        required: true
        type: string
      lab_scope:
        description: Hash-bound lab qualification scope and limitations
        required: true
        type: string
      verify_only:
        description: Build, compare and attest without publishing the draft
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.release_tag }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.release_tag }}
  SOURCE_COMMIT: ${{ inputs.source_commit }}
  BINARY_SHA256: ${{ inputs.binary_sha256 }}
  MANIFEST_SHA256: ${{ inputs.manifest_sha256 }}
  LAB_SCOPE: ${{ inputs.lab_scope }}
  ZIG_VERSION: "0.14.1"
  ZIG_SHA256: "24aeeec8af16c381934a6cd7d95c807a8cb2cf7df9fa40d359aa884195c4716c"

jobs:
  qualify:
    name: Qualify exact source and release authority
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Require the trusted main workflow
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: control
      - name: Validate fixed release inputs
        run: bash control/.github/scripts/release.sh inputs
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ inputs.source_commit }}
          path: source
      - name: Verify source, live tag, and successful full CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          checked_out="$(git -C source rev-parse HEAD)"
          bash control/.github/scripts/release.sh identity "$checked_out" "$SOURCE_COMMIT"
          bash control/.github/scripts/release.sh tag
          source_version="$(sed -n 's/^ *\.version = "\([^"]*\)".*/\1/p' source/build.zig.zon)"
          test "$source_version" = "${RELEASE_TAG#v}"
          test -f source/RELEASE_NOTES.md
          bash control/.github/scripts/release.sh qualify
          draft="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
          test "$draft" = true
      - name: Require configured publication approval
        if: ${{ !inputs.verify_only }}
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLICATION_ENABLED: ${{ vars.RELEASE_PUBLICATION_ENABLED }}
        run: bash control/.github/scripts/release.sh publication-guard
      - name: Record approved candidate and lab scope
        run: |
          {
            printf '## Approved release candidate\n\n'
            printf 'Source: `%s`\n\nBinary SHA-256: `%s`\n\nManifest SHA-256: `%s`\n\n' \
              "$SOURCE_COMMIT" "$BINARY_SHA256" "$MANIFEST_SHA256"
            printf 'Maintainer-supplied lab scope (not performed by this workflow):\n\n'
            printf '%s\n' "$LAB_SCOPE"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build release (${{ matrix.target }})
    needs: qualify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - {target: x86_64-linux-musl, cpu: baseline}
          - {target: aarch64-linux-musl, cpu: baseline}
          - {target: arm-linux-musleabihf, cpu: baseline}
          - {target: mips-linux-musleabi, cpu: mips32r2}
          - {target: mipsel-linux-musleabi, cpu: mips32r2}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ inputs.source_commit }}
      - name: Install pinned Zig
        run: |
          curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz" -o /tmp/zig.tar.xz
          echo "${ZIG_SHA256}  /tmp/zig.tar.xz" | sha256sum -c -
          sudo mkdir -p /opt/zig
          sudo tar -xf /tmp/zig.tar.xz -C /opt/zig --strip-components=1
          echo /opt/zig >> "$GITHUB_PATH"
      - name: Build the one release executable
        env:
          RELEASE_TARGET: ${{ matrix.target }}
          RELEASE_CPU: ${{ matrix.cpu }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          zig build -Dtarget="$RELEASE_TARGET" -Dcpu="$RELEASE_CPU" -Doptimize=ReleaseSafe -Dstrip=true
          test "$(find zig-out/bin -mindepth 1 -maxdepth 1 -printf '%f\n')" = fail2zig
          test -f zig-out/bin/fail2zig
          test ! -L zig-out/bin/fail2zig
          mkdir package
          cp zig-out/bin/fail2zig "package/fail2zig-$RELEASE_TAG-$RELEASE_TARGET"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-binary-${{ matrix.target }}
          path: package/*
          if-no-files-found: error
          retention-days: 7

  verify:
    name: Compare independently built package to approved bytes
    needs: [qualify, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: control
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ inputs.source_commit }}
          path: source
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: release-binary-*
          merge-multiple: true
          path: package
      - name: Assemble all fixed source payloads and compare approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_COMMIT"
          bash control/.github/scripts/release.sh assemble source package
          mkdir approved
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir approved
          bash control/.github/scripts/release.sh compare package approved
          bash control/.github/scripts/release.sh elf "$PWD/package"
          bash control/.github/scripts/release.sh tag
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: verified-release-package
          path: package/*
          if-no-files-found: error
          retention-days: 7

  attest:
    name: Attest the verified runner package
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: verified-release-package
          path: package
      - name: Describe actual build inputs, separately from the workflow commit
        run: |
          jq -n --arg repo "$GITHUB_REPOSITORY" --arg source "$SOURCE_COMMIT" \
            --arg workflow "$GITHUB_SHA" --arg tag "$RELEASE_TAG" --arg run "$GITHUB_RUN_ID" \
            --arg attempt "$GITHUB_RUN_ATTEMPT" --arg zig "$ZIG_VERSION" --arg zig_hash "$ZIG_SHA256" \
            --arg binary "$BINARY_SHA256" --arg manifest "$MANIFEST_SHA256" --arg scope "$LAB_SCOPE" '
            {
              buildDefinition: {
                buildType: ("https://github.com/" + $repo + "/blob/main/.github/workflows/release.yml"),
                externalParameters: {
                  source_commit: $source, release_tag: $tag,
                  approved_binary_sha256: $binary, approved_manifest_sha256: $manifest,
                  maintainer_reported_lab_scope: $scope
                },
                internalParameters: {workflow_commit: $workflow, run_attempt: $attempt},
                resolvedDependencies: [
                  {uri: ("git+https://github.com/" + $repo), digest: {gitCommit: $source}},
                  {uri: ("https://ziglang.org/download/" + $zig + "/zig-x86_64-linux-" + $zig + ".tar.xz"),
                   digest: {sha256: $zig_hash}}
                ]
              },
              runDetails: {
                builder: {id: ("https://github.com/" + $repo + "/.github/workflows/release.yml@" + $workflow)},
                metadata: {invocationId: ("https://github.com/" + $repo + "/actions/runs/" + $run + "/attempts/" + $attempt)}
              }
            }' > predicate.json
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: package/*
          predicate-type: https://slsa.dev/provenance/v1
          predicate-path: predicate.json

  publish:
    name: Approve publication and verify downloaded release
    if: ${{ !inputs.verify_only }}
    needs: [qualify, verify, attest]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          path: control
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ inputs.source_commit }}
          path: source
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: verified-release-package
          path: package
      - name: Recheck approval, tag, and draft immediately before publication
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLICATION_ENABLED: ${{ vars.RELEASE_PUBLICATION_ENABLED }}
        run: |
          bash control/.github/scripts/release.sh publication-guard
          draft="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
          test "$draft" = true
          mkdir approved
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir approved
          bash control/.github/scripts/release.sh compare package approved
          bash control/.github/scripts/release.sh tag
          # Draft bytes already equal every attested runner payload. Do not replace assets.
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --title "fail2zig $RELEASE_TAG" --notes-file source/RELEASE_NOTES.md --draft=false --latest
      - name: Re-download and compare all published bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir published
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir published
          bash control/.github/scripts/release.sh compare package published
          bash control/.github/scripts/release.sh tag
