name: Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to create or resume (vMAJOR.MINOR.PATCH)
        required: true
        type: string
      source_commit:
        description: Full merged source commit SHA
        required: true
        type: string
      ci_run_id:
        description: Successful full PR CI run ID (or explicit main qualification)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.release_tag }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  RELEASE_TAG: ${{ inputs.release_tag }}
  SOURCE_COMMIT: ${{ inputs.source_commit }}
  CI_RUN_ID: ${{ inputs.ci_run_id }}

jobs:
  qualify:
    name: Qualify merged source
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      binary_sha256: ${{ steps.qualify.outputs.binary_sha256 }}
      source_tree: ${{ steps.qualify.outputs.source_tree }}
      ci_attempt: ${{ steps.qualify.outputs.ci_attempt }}
      qualification_sha256: ${{ steps.qualify.outputs.qualification_sha256 }}
    steps:
      - name: Require the trusted workflow
        run: |
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_REPOSITORY" = ul0gic/fail2zig
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate release inputs and source ancestry
        run: |
          bash .github/scripts/release.sh inputs
          git merge-base --is-ancestor "$SOURCE_COMMIT" HEAD
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ inputs.source_commit }}
          path: source
      - name: Verify PR evidence, source and publication gate
        id: qualify
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLICATION_ENABLED: ${{ vars.RELEASE_PUBLICATION_ENABLED }}
        run: |
          bash .github/scripts/release.sh identity "$(git -C source rev-parse HEAD)" "$SOURCE_COMMIT"
          version=$(sed -n 's/^ *\.version = "\([^"]*\)".*/\1/p' source/build.zig.zon)
          test "$version" = "${RELEASE_TAG#v}"
          test -s source/RELEASE_NOTES.md
          bash .github/scripts/release.sh tag optional
          bash .github/scripts/release.sh publication-guard
          bash .github/scripts/release.sh qualify qualification
          test "$(git -C source rev-parse 'HEAD^{tree}')" = "$(jq -r '.tree.sha' qualification/source.json)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: release-qualification-${{ github.run_attempt }}
          path: qualification/
          if-no-files-found: ignore
          retention-days: 90

  build:
    name: Build (${{ matrix.target }})
    needs: qualify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-linux-musl
            cpu: baseline
          - target: aarch64-linux-musl
            cpu: baseline
          - target: arm-linux-musleabihf
            cpu: baseline
          - target: mips-linux-musleabi
            cpu: mips32r2
          - target: mipsel-linux-musleabi
            cpu: mips32r2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ inputs.source_commit }}
          path: source
      - uses: ./.github/actions/setup-zig
        id: zig
        with:
          directory: source
          target: ${{ matrix.target }}
      - name: Build release executable
        working-directory: source
        env:
          F2Z_ZIG: ${{ steps.zig.outputs.executable }}
          TARGET: ${{ matrix.target }}
          CPU: ${{ matrix.cpu }}
          TESTED_SHA256: ${{ needs.qualify.outputs.binary_sha256 }}
        run: |
          "$F2Z_ZIG" build -Dtarget="$TARGET" -Dcpu="$CPU" -Doptimize=ReleaseSafe -Dstrip=true -j2
          test "$(find zig-out/bin -maxdepth 1 -type f | wc -l)" = 1
          if [ "$TARGET" = x86_64-linux-musl ]; then
            printf '%s  zig-out/bin/fail2zig\n' "$TESTED_SHA256" | sha256sum --check --strict
          fi
          mkdir "$GITHUB_WORKSPACE/payload"
          cp zig-out/bin/fail2zig "$GITHUB_WORKSPACE/payload/fail2zig-$RELEASE_TAG-$TARGET"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-binary-${{ matrix.target }}
          path: payload/
          if-no-files-found: error
          retention-days: 90
          overwrite: true

  package:
    name: Assemble and hash release
    needs: [qualify, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      BINARY_SHA256: ${{ needs.qualify.outputs.binary_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ inputs.source_commit }}
          path: source
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: release-binary-*
          path: package
          merge-multiple: true
      - name: Verify package and record hashes
        id: package
        run: |
          bash .github/scripts/release.sh assemble source package
          bash .github/scripts/release.sh elf "$PWD/package"
          {
            printf '## Release candidate %s\n\n' "$RELEASE_TAG"
            printf 'Source: %s\n\nTested x86_64 SHA-256: %s\n\n' "$SOURCE_COMMIT" "$BINARY_SHA256"
            printf 'SHA256SUMS SHA-256: %s\n\n' "$(sha256sum package/SHA256SUMS | cut -d ' ' -f 1)"
            printf 'PR qualification: %s/%s/actions/runs/%s\n\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$CI_RUN_ID"
            printf '```text\n'; cat package/SHA256SUMS; printf '```\n'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        id: upload
        with:
          name: verified-release-package-${{ github.run_attempt }}
          path: package/
          if-no-files-found: error
          retention-days: 90
    outputs:
      manifest_sha256: ${{ steps.package.outputs.manifest_sha256 }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}

  attest:
    name: Attest verified assets
    needs: [qualify, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      BINARY_SHA256: ${{ needs.qualify.outputs.binary_sha256 }}
      MANIFEST_SHA256: ${{ needs.package.outputs.manifest_sha256 }}
      SOURCE_TREE: ${{ needs.qualify.outputs.source_tree }}
      QUALIFICATION_SHA256: ${{ needs.qualify.outputs.qualification_sha256 }}
      CI_ATTEMPT: ${{ needs.qualify.outputs.ci_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ inputs.source_commit }}
          path: source
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.package.outputs.artifact_id }}
          path: package
          merge-multiple: true
      - name: Bind provenance to the actual source, toolchain and qualification
        run: |
          bash .github/scripts/release.sh package package true
          bash .github/scripts/release.sh provenance source predicate.json
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: package/*
          predicate-type: https://slsa.dev/provenance/v1
          predicate-path: predicate.json

  publish:
    name: Approve and publish verified assets
    needs: [qualify, package, attest]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: release
    permissions:
      contents: write
      actions: read
    env:
      BINARY_SHA256: ${{ needs.qualify.outputs.binary_sha256 }}
      MANIFEST_SHA256: ${{ needs.package.outputs.manifest_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ inputs.source_commit }}
          path: source
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.package.outputs.artifact_id }}
          path: package
          merge-multiple: true
      - name: Publish unchanged assets and verify the public download
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLICATION_ENABLED: ${{ vars.RELEASE_PUBLICATION_ENABLED }}
        run: bash .github/scripts/release.sh publish package source
