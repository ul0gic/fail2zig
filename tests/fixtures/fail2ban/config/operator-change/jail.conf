[DEFAULT]
ignoreip = 127.0.0.1/8 ::1 gateway.example
bantime = 10m
bantime.increment = true
findtime = 10m
maxretry = 5
backend = auto
usedns = no
banaction = nftables-allports
port = 0:65535
protocol = tcp
chain = INPUT
action_ = %(banaction)s[port="%(port)s", protocol="%(protocol)s", chain="%(chain)s"]
action = %(action_)s

[sshd]
enabled = true
port = ssh
logpath = /var/log/auth.log
