[DEFAULT]
ignoreip = 127.0.0.1/8 ::1
bantime = 10m
findtime = 10m
maxretry = 5
backend = auto
usedns = no
banaction = nftables-allports
port = 0:65535
protocol = tcp
chain = INPUT
action_ = %(banaction)s[port="%(port)s", protocol="%(protocol)s", chain="%(chain)s"]
action = %(action_)s

[myapp]
enabled = true
filter = myapp
port = 8080
logpath = /var/log/myapp/access.log

[sshd]
enabled = true
port = ssh
logpath = /var/log/auth.log
action = notify-admin[name=sshd]

[nginx-http-auth]
enabled = true
port = http,https
logpath = /var/log/nginx/error.log
ignorecommand = /usr/local/bin/check-ip <ip>
bantime = %(findtime)s
findtime = %(bantime)s
