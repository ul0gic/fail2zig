# Minimal original derivation of the fail2ban 1.1.1 jail.conf layout.
[DEFAULT]
ignoreip = 127.0.0.1/8 ::1
bantime = 10m
findtime = 10m
maxretry = 5
backend = auto
usedns = no
banaction = nftables-allports
port = 0:65535
protocol = tcp
chain = INPUT
action_ = %(banaction)s[port="%(port)s", protocol="%(protocol)s", chain="%(chain)s"]
action = %(action_)s

[sshd]
enabled = true
port = ssh
backend = systemd
journalmatch = _SYSTEMD_UNIT=sshd.service + _COMM=sshd

[nginx-http-auth]
enabled = true
port = http,https
logpath = /var/log/nginx/error.log

[postfix]
enabled = false
logpath = /var/log/mail.log
